<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JWB Storage Inventory</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f3a5f'/%3E%3Cpath d='M7 9h18v4H7zm2 6h14v9H9z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <h1>JWB Storage Inventory</h1>
        <p class="sub" id="source">Loading…</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <main class="wrap">
    <div id="banner" class="banner" hidden></div>

    <section class="kpis" id="kpis" aria-label="Summary"></section>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" aria-selected="true" data-tab="inventory">Inventory</button>
      <button role="tab" aria-selected="false" data-tab="order">To order</button>
      <button role="tab" aria-selected="false" data-tab="prices">Price compare</button>
      <button role="tab" aria-selected="false" data-tab="orders">Recent orders</button>
    </nav>

    <section id="tab-inventory" class="panel">
      <div class="filters">
        <input id="q" type="search" placeholder="Search item, ID, location, SKU…" aria-label="Search">
        <select id="cat" aria-label="Category"></select>
        <select id="status" aria-label="Status">
          <option value="">All statuses</option>
          <option>Out of stock</option>
          <option>Low</option>
          <option>OK</option>
          <option>Needs count</option>
        </select>
      </div>
      <div class="table-wrap"><table id="inv"></table></div>
    </section>

    <section id="tab-order" class="panel" hidden>
      <div class="panel-head">
        <p class="hint">Items at or below their minimum. Reorder qty = target − on hand.</p>
        <button id="dl" type="button">Download CSV</button>
      </div>
      <div class="table-wrap"><table id="ord"></table></div>
    </section>

    <section id="tab-prices" class="panel" hidden>
      <p class="hint">Net unit price after the Pro discount. Add Home Depot Pro prices in the sheet to compare.</p>
      <div class="table-wrap"><table id="prc"></table></div>
    </section>

    <section id="tab-orders" class="panel" hidden>
      <div id="orders"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
